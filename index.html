<body>
<div id="app"></div>
<div id="set" onclick="if(event.target==this)this.classList.remove('on')"><div class="sh"><h3>Настройки</h3>
<label class="row"><span><b>Сквиз — просмотр карт</b><small>Карты открываются на отдельной панели: загните уголок, чтобы посмотреть. Если выключить, карты открываются кнопкой «Смотреть».</small></span>
<span class="sw"><input id="sqc" type="checkbox" onchange="setSQ(this.checked)"><i></i></span></label>
<h4>Аватар</h4><div id="avs" class="avg"></div>
<h4>Стол и карты</h4><div class="row2">
<label>Сукно <select id="pfelt" onchange="setPref('felt',this.value)"><option value="">Зелёное</option><option value="blue">Синее</option><option value="wine">Бордовое</option><option value="violet">Фиолетовое</option></select></label>
<label>Карты <select id="pdeck" onchange="setPref('deck',this.value)"><option value="">Четырёхцветные</option><option value="classic">Классические</option></select></label>
<label>Рубашка <select id="pback" onchange="setPref('back',this.value)"><option value="">Красная</option><option value="blue">Синяя</option><option value="green">Зелёная</option><option value="black">Чёрная</option></select></label>
<label>Ставки <select id="pmoney" onchange="setPref('money',this.value)"><option value="chips">Фишки</option><option value="rub">Рубли</option></select></label></div></div></div>
<div id="chat" onclick="if(event.target==this)chatOpen(0)"><div class="sh"><b>Чат стола</b><div id="cm"></div><div class="cin"><input id="ci" maxlength="200" placeholder="Сообщение" onkeydown="if(event.key=='Enter')chatSend()"><button class="p" onclick="chatSend()">➤</button></div></div></div></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
try{tg.ready();tg.expand();tg.setHeaderColor('#0b1110');tg.setBackgroundColor('#0b1110')}catch(e){}
const MAXBET=160,SU=['♠','♥','♦','♣'],RL={11:'Т'};
const el=document.getElementById('app'),$=id=>document.getElementById(id);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
let PID=ls('pid')||(()=>{const v=Math.random().toString(36).slice(2)+Date.now().toString(36)+'x1';ls('pid',v);return v})();
let NAME=ls('nm')||(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'Игрок';NAME=String(NAME).replace(/[<>&"'`\\]/g,'').slice(0,16);
let S=null,LB=[],DRAG=0,PEND=0,DIRTY=0,SQP=0,ERR='',ws,V='menu',ready=0,TRY=0,DIAG='',TOFF=0,RZ=0,RV=0,ME={bal:0,st:{},bonus:0,t0:0};
let SQ=false,PM=ls('p_money')||'chips';try{SQ=localStorage.getItem('sq')==='1'}catch(e){}
const CID=PID+Math.random().toString(36).slice(2,8);let TR=/[?&]http/.test(location.search)?'http':'ws',HQ=[],HB=0,OPENED=0;
const net=o=>{if(TR=='ws'){if(ws&&ws.readyState==1)ws.send(JSON.stringify(o))}else{HQ.push(o);hflush()}};
async function hflush(){if(HB)return;HB=1;while(HQ.length){const o=HQ.shift();try{await fetch('/api/send?cid='+CID,{method:'POST',body:JSON.stringify(o)})}catch(e){}}HB=0}
async function hpoll(){for(;;){try{const r=await fetch('/api/poll?cid='+CID),a=await r.json();if(!ready){ready=1;ERR='';TRY=0;DIAG=''}a.forEach(onMsg)}catch(e){ready=0;DIAG='нет связи';render();await new Promise(r=>setTimeout(r,1500))}}}

 const R=[[0,0],[CW,0],[CW,CH],[0,CH]],f=p=>(p[0]-mx)*nx+(p[1]-my)*ny;
 const cut=sg=>{const o=[];for(let i=0;i<4;i++){const a=R[i],b=R[(i+1)%4],fa=sg*f(a),fb=sg*f(b);
  if(fa>=0)o.push(a);if((fa>=0)!=(fb>=0)){const t=fa/(fa-fb);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}return o};

 if(n2<1){kb.style.clipPath='none';fl.style.clipPath=ps([],0);return 0}

 <button class="mb" onclick="openSet()">⚙️ Настройки</button>${ready?'':'<small>Подключаемся…</small>'}${ERR?`<div class="er">${ERR}</div>`:''}</div>`}
function profile(){const s=ME.st||{},w=s.g?Math.round(100*(s.w||0)/s.g):0,cur=ls('avimg')||ls('avurl')||ls('ave')||'🙂';
 return TOP+BK+`<div class="card2"><h3>Профиль</h3><div class="pav">${avh(cur)}</div>
 <button onclick="openSet()">Сменить аватар</button><input id="pn" value="${NAME}" maxlength="16" placeholder="Ваше имя" onchange="setName(this.value)">
 <h4>Статистика</h4><div class="stg"><div><b>${s.g||0}</b><small>раздач сыграно</small></div><div><b>${s.w||0}</b><small>побед (${w}%)</small></div>
 <div><b>${s.sv||0}</b><small>свар сыграно</small></div><div><b>${s.svw||0}</b><small>побед в свару</small></div>
 <div><b>${s.big||0}</b><small>крупнейший банк</small></div><div><b>${s.mx||0}</b><small>макс. баланс</small></div>
 <div><b>${s.aaa||0}</b><small>три туза</small></div><div><b>${s.s666||0}</b><small>три шестёрки</small></div>
 <div><b>${s.p21||0}</b><small>раз по 21 очку</small></div><div><b>${s.a109||0}</b><small>туз+10+9 одной масти</small></div><div style="grid-column:span 2"><b>${(s.net||0)>0?'+':''}${s.net||0}</b><small>чистый выигрыш за всё время</small></div></div></div>`}
function ach(){const st=ME.st||{};return TOP+BK+`<div class="card2"><h3>Достижения</h3><small>Открыто ${achDone()} из ${ACH.length}</small>`+
 ACH.map(a=>{const v=a[3](st),p=Math.min(100,Math.round(100*v/a[4])),on=v>=a[4];return`<div class="ach ${on?'on':''}"><div class="ic">${a[0]}</div><div><b>${a[1]}</b><br><small>${a[2]}</small><div class="pb"><u style="width:${p}%"></u></div></div></div>`}).join('')+`</div>`}
function balscr(){const left=Math.max(0,(ME.bonus||0)-(Date.now()-(ME.t0||0))),h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000);
 return TOP+BK+`<div class="card2"><h3>Баланс</h3><div class="bigbal">${ME.bal}</div><small style="text-align:center">фишек. Баланс общий для всех столов, выйдя из-за стола вы забираете фишки с собой.</small>
 <button class="p" onclick="net({t:'bonus'})" ${left?'disabled':''}>${left?`Бонус дня через ${h} ч ${m} мин`:'Забрать бонус дня +500'}</button>${ME.ks===false?'<div class="er">На сервере не задан SECRET: после перезапуска сервера баланс и достижения сбросятся. Добавьте SECRET в настройках Render.</div>':''}<small style="text-align:center">${ls('bk')?'Копия данных сохранена':'Копия данных ещё не получена'}</small></div>`}
const SCR={menu,lobby,profile,ach,bal:balscr,top:topscr};
setInterval(()=>{if(V=='bal'&&ME.bonus)render()},30000);
const CS=tg&&tg.initData&&tg.CloudStorage?tg.CloudStorage:null;
const cget=k=>new Promise(r=>{if(!CS)return r('');let d=0;const f=v=>{if(!d){d=1;r(v||'')}};try{CS.getItem(k,(e,v)=>f(e?'':v))}catch(e){f('')}setTimeout(()=>f(''),2500)});
const cset=(k,v)=>{try{CS&&CS.setItem(k,v)}catch(e){}};
async function init(){const cp=await cget('pid');if(cp&&cp.length>=8&&cp.length<=60){PID=cp;ls('pid',cp)}else cset('pid',PID);
 const cb=await cget('bk');if(cb&&!ls('bk'))ls('bk',cb)}
const SKIP={k:0};
function svbox(){const v=S.sv;if(!v){SKIP.k=0;return''}if(S.over||SKIP.k==S.rid)return'';
 const b=(t,l,c)=>`<button class="${c||''} w3" onclick="${t}">${l}</button>`;let h;
 if(v.ph=='vote')h=v.you=='vote'?`<b>${v.from} предлагает свару</b><small>Новая раздача, банк (${v.bank}) остаётся. Нужно согласие всех игроков.</small><div class="acts">${b("net({t:'svar',ok:0})",'Против')}${b("net({t:'svar',ok:1})",'Согласен','p')}</div>`
  :v.you=='prop'?`<b>Вы предложили свару</b><small>Согласны: ${v.yes} из ${v.need}</small><div class="acts">${b("net({t:'svar',ok:0})",'Отменить')}</div>`
  :`<b>Свара: ждём ответов</b><small>Согласны: ${v.yes} из ${v.need}. Если все согласятся, выбывшие смогут войти за ${v.half} (нужно столько фишек).</small>`;
 else h=v.you=='join'?`<b>Свара! Войти в игру?</b><small>Вход: ${v.half} (банк ${v.bank} поровну на ${v.need} игр.).</small><div class="acts">${b("SKIP.k=S.rid;render()",'Пропустить')}${b("net({t:'sjoin'})",'Войти за '+v.half,'p')}</div>`
  :v.you=='joined'?`<b>Вы в свару</b><small>Сейчас будет новая раздача.</small>`:`<b>Свара</b><small>Идёт набор желающих, банк ${v.bank}.</small>`;
 return`<div class="svb"><div class="sh">${h}</div></div>`}
function game(){const m=S.ps[0],mine=!S.over&&S.turn==0&&m.in&&!S.pk&&!S.dk,al=act().length,pa=act(),pq=S.ps[pa[(pa.indexOf(0)+pa.length-1)%pa.length]]||m;
 const kk=[0,1,2].find(k=>!up(k)),all=allUp();
 const panel=SQP&&SQ&&!S.over&&m.in&&!m.fold&&!all?`<div class="sq"><button class="hide" onclick="SQP=0;render()">Скрыть</button><button class="op" onclick="openAll()">Открыть</button>
 <div class="sw3"><div class="pc" data-k="${kk}">${card(m.hand[kk],{big:1})}<div class="cv"><div class="c big b kb"></div><div class="fl"></div></div></div></div></div>`:'';
 return TOP+chatb()+`<button class="leave" onclick="net({t:'leave'})">←</button><div class="tb">${S.ps.map((p,i)=>seat(i)).join('')}
 <div class="pot"><small>${S.name} · банк</small><b>${S.bank}</b><small>ставка ${S.bet}</small>${S.pile?`<div class="pile">${money(S.pile,1)}</div>`:''}</div>
 <div class="msg"><span>${S.over?'':S.old||''}</span><br>${S.msg}</div></div>
 ${S.over?`<div class="acts"><button class="p w6" onclick="net({t:'${S.end?'start':'next'}'})">${S.end?'Играть заново':'Следующая раздача'}</button></div>`:
 `<div class="acts">
 <button class="w2" onclick="go('fold')" ${mine?'':'disabled'}><b>Пас</b></button>
 <button class="p w2" onclick="go('call')" ${mine?'':'disabled'}><b>Поставить</b><small>${cost(m)}</small></button>
 <button class="w2" onclick="RZ=1;RV=0;render()" ${mine&&rzr()[1]>S.bet?'':'disabled'}><b>Повысить</b><small>от ${S.bet+10}</small></button>
 <button class="w2" onclick="look()" ${!S.over&&m.in&&!all?'':'disabled'}><b>Смотреть</b></button>
 <button class="w2" onclick="go('show')" ${mine&&al>=2&&!pq.blind?'':'disabled'}><b>Вскрыть</b><small>${pq.n} · ${cost(m)}</small></button>
 <button class="w2" onclick="net({t:'svara'})" ${!S.over&&m.in&&!m.fold&&al==2&&!S.sv?'':'disabled'}><b>Свара</b></button></div>`}${panel}${svbox()}${rzbox()}${pkbox()}${aibox()}${spbox()}${tibox()}${darkbox()}${cutbox()}`}
function render(){if(DRAG){PEND=1;return}PEND=0;
 if(V!='table'||!S){if(el.querySelector('input:focus'))return;el.innerHTML=(SCR[V]||menu)();return}
 const oldb={};if(S.started)el.querySelectorAll('.bw .bet').forEach(e=>{const r=e.getBoundingClientRect();oldb[e.parentNode.dataset.i]={x:r.left,y:r.top,h:e.outerHTML}});
 el.innerHTML=!S.started?wait():game();bindAll();
 if(S.started&&(S.sw||0)>PSW){const pr=document.querySelector('.pot'),pb=pr&&pr.getBoundingClientRect();
  if(pb)Object.values(oldb).forEach(o=>{const f=document.createElement('div');f.className='fly';f.innerHTML=o.h;f.style.left=o.x+'px';f.style.top=o.y+'px';document.body.appendChild(f);
   requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${pb.left+pb.width/2-o.x-30}px,${pb.top+pb.height/2-o.y}px) scale(.7)`;f.style.opacity='.35'}));setTimeout(()=>f.remove(),950)})}
 PSW=S.sw||0}
['felt','deck','back'].forEach(k=>document.body.dataset[k]=ls('p_'+k)||'');render();init().then(connect);setInterval(()=>net({t:'ping'}),20000);
</script>
</body>
</html>
